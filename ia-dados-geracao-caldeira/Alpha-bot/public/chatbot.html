<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Insight-Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Settings Button -->
        <button class="settings-button" id="settingsButton">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>

        <!-- Sidebar Settings -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Customize seu bot</h2>
                <button class="close-button" id="closeButton">✕</button>
            </div>
            
            <div class="theme-section">
                <h3>Tema</h3>
                <div class="theme-options">
                    <div class="theme-option active" data-theme="light">
                        <div class="theme-icon">☀️</div>
                        <div class="theme-label">Light</div>
                    </div>
                    <div class="theme-option" data-theme="dark">
                        <div class="theme-icon">🌙</div>
                        <div class="theme-label">Dark</div>
                    </div>
                </div>
            </div>

            <div class="color-section">
                <h3>Cores</h3>
                <div class="color-label">Cor de destaque</div>
                <div class="color-options" id="accentColors">
                    <div class="color-option" style="background: #6b46c1" data-color="#6b46c1"></div>
                    <div class="color-option" style="background: #9333ea" data-color="#9333ea"></div>
                    <div class="color-option" style="background: #dc2626" data-color="#dc2626"></div>
                    <div class="color-option" style="background: #ea580c" data-color="#ea580c"></div>
                    <div class="color-option" style="background: #eab308" data-color="#eab308"></div>
                    <div class="color-option active" style="background: #10a37f" data-color="#10a37f"></div>
                    <div class="color-option" style="background: #3b82f6" data-color="#3b82f6"></div>
                    <div class="color-option" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)" data-color="gradient"></div>
                </div>

                <div class="color-label">Mensagens do bot</div>
                <div class="color-options" id="botColors">
                    <div class="color-option active" style="background: white; border: 2px solid #e0e0e0" data-color="#ffffff"></div>
                    <div class="color-option" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)" data-color="gradient"></div>
                </div>
            </div>
        </div>

        <!-- Overlay -->
        <div class="overlay" id="overlay"></div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <img src="assets/Alphie 2.jpg" alt="Alphie" class= " bot-avatar">
                <div>
                
                    <div style="font-weight: bold;">Alpha Bot</div>
                    <div style="font-size: 14px; opacity: 0.9;">Online</div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
               
                <div class="suggested-replies">
                    <div class="suggested-reply" onclick="sendSuggestedReply('Como você funciona?')">Como você funciona?</div>
                    <div class="suggested-reply" onclick="sendSuggestedReply('Quais são suas funcionalidades?')">Suas funcionalidades</div>
                </div>
            </div>
           

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Digite sua mensagem...">
                    <button class="send-button" id="sendButton">➤</button>

 
    
   
</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
