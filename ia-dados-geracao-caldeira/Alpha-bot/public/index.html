<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Insight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            background: white;
            padding: 60px 80px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-out;
            max-width: 500px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            margin-bottom: 30px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .robot-icon {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(86, 204, 242, 0.4);
        }

        .robot-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 42px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .start-button:active {
            transform: translateY(-1px);
        }

        /* Animação de partículas no fundo */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Partículas de fundo -->
    <div class="particle" style="width: 10px; height: 10px; left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="width: 15px; height: 15px; left: 20%; animation-delay: 2s;"></div>
    <div class="particle" style="width: 8px; height: 8px; left: 30%; animation-delay: 4s;"></div>
    <div class="particle" style="width: 12px; height: 12px; left: 40%; animation-delay: 1s;"></div>
    <div class="particle" style="width: 10px; height: 10px; left: 50%; animation-delay: 3s;"></div>
    <div class="particle" style="width: 14px; height: 14px; left: 60%; animation-delay: 5s;"></div>
    <div class="particle" style="width: 9px; height: 9px; left: 70%; animation-delay: 2.5s;"></div>
    <div class="particle" style="width: 11px; height: 11px; left: 80%; animation-delay: 4.5s;"></div>
    <div class="particle" style="width: 13px; height: 13px; left: 90%; animation-delay: 1.5s;"></div>

    <!-- Tela Inicial -->
    <div class="splash-container" id="splashScreen">
        <div class="logo-container">
            <div class="robot-icon">
                <img src="assets/Alphie 2.jpg" alt="Logo Alpha Bot">
            </div>
        </div>
        <h1>Alpha</h1>
        <p>Assistente de vendas da Alpha Insight</p>
        <button class="start-button" onclick="startChat()">
            Clique aqui para começar
        </button>
    </div>

    <!-- Container do Chatbot (inicialmente oculto) -->
    <div class="chatbot-container hidden" id="chatbotContainer">
        <!-- Aqui você vai colocar todo o código do seu chatbot -->
        <h1 style="padding: 20px; text-align: center;">Seu Chatbot Aqui</h1>
    </div>

    <script>
        function startChat() {
            window.location.href = 'chatbot.html';
        }

        // Adiciona animação de fadeOut
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from {
                    opacity: 1;
                    transform: translateY(0);
                }
                to {
                    opacity: 0;
                    transform: translateY(-30px);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
